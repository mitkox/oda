# ODA Configuration File

# Version-pinned dependencies
PYTHON_VERSION="3.10"
PYTORCH_VERSION="2.1.0"
TENSORFLOW_VERSION="2.14.0"
NUMPY_VERSION="1.24.3"
PANDAS_VERSION="2.1.1"
SCIKIT_VERSION="1.3.1"
NVIDIA_VERSION="535"
TENSORRT_VERSION="8.6.1"
TRITON_VERSION="2.40.0"
TVM_VERSION="0.15.0"

# Installation directory
INSTALL_DIR="$HOME/.oda"
VENV_DIR="$HOME/.oda-venv"
LOG_FILE="/tmp/oda-install.log"
